name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, fileinfo, apcu
          ini-values: apc.enable_cli=1
          tools: none
          coverage: none
      - name: Lint
        run: for f in app.php Parsedown.php www/index.php tests/*.php; do php -l "$f" || exit 1; done
      - name: Test
        run: tests/run.sh
